<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

#cloud{
    position:fixed;
    inset:0;
    overflow:hidden;
    user-select:none;
}

.word{
    position:absolute;
    color:#dddddd;
    white-space:nowrap;
    pointer-events:none;
    opacity:.07;
    text-shadow:0 0 2px rgba(255,255,255,.08);
}

#joshua{
    position:absolute;
    color:white;
    opacity:.02;
    cursor:default;
    user-select:none;
}

.hidden{
    display:none !important;
}

#clockScreen{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:black;
}

#clock{
    color:#eee;
    font-size:70px;
    font-family:monospace;
    letter-spacing:5px;
}

#humanity{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:black;
    overflow:hidden;
}

#humanity img{
    position:absolute;
    width:min(700px,85vw);
    filter:grayscale(100%) contrast(3);
    opacity:.15;
    animation:imageBlink 3s infinite;
}

#humanity h1{
    position:relative;
    z-index:2;
    color:white;
    font-size:clamp(42px,7vw,90px);
    letter-spacing:8px;
    animation:textBlink 2.5s infinite;
    text-shadow:
    0 0 8px white,
    0 0 18px white;
}

@keyframes textBlink{

    0%,100%{
        opacity:1;
    }

    50%{
        opacity:.08;
    }

}

@keyframes imageBlink{

    0%,100%{
        opacity:.08;
    }

    50%{
        opacity:.35;
    }

}
</style>

const cloud=document.getElementById("cloud");

function gerarNuvem(){

    const espacamentoX=150;
    const espacamentoY=50;

    const colunas=Math.ceil(window.innerWidth/espacamentoX);
    const linhas=Math.ceil(window.innerHeight/espacamentoY);

    const posicoes=[];

    for(let y=0;y<linhas;y++){

        for(let x=0;x<colunas;x++){

            posicoes.push({

                x:x*espacamentoX+Math.random()*50,
                y:y*espacamentoY+Math.random()*20

            });

        }

    }

    posicoes.sort(()=>Math.random()-0.5);

    posicoes.forEach((p,i)=>{

        const span=document.createElement("span");

        span.className="word";

        span.textContent=palavras[i%palavras.length];

        span.style.left=p.x+"px";
        span.style.top=p.y+"px";

        span.style.fontSize=(12+Math.random()*24)+"px";

        span.style.opacity=(0.03+Math.random()*0.08).toFixed(2);

        span.style.transform=`rotate(${Math.random()*10-5}deg)`;

        cloud.appendChild(span);

    });

    const j=document.createElement("span");

    j.id="joshua";

    j.textContent="joshua";

    const meio=posicoes[Math.floor(posicoes.length/2)];

    j.style.left=meio.x+"px";
    j.style.top=meio.y+"px";

    j.style.fontSize="18px";

    j.style.opacity=".02";

    j.addEventListener("click",function(e){

        e.stopPropagation();

        abrirRelogio();

    });

    cloud.appendChild(j);

}

gerarNuvem();

const clock=document.getElementById("clock");
const clockScreen=document.getElementById("clockScreen");
const humanity=document.getElementById("humanity");

function abrirRelogio(){

    cloud.classList.add("hidden");

    clockScreen.classList.remove("hidden");

}

function abrirHumanidade(){

    cloud.classList.add("hidden");

    clockScreen.classList.add("hidden");

    humanity.classList.remove("hidden");

}

function atualizarRelogio(){

    const agora=new Date();

    const h=String(agora.getHours()).padStart(2,"0");
    const m=String(agora.getMinutes()).padStart(2,"0");
    const s=String(agora.getSeconds()).padStart(2,"0");

    clock.textContent=`${h}:${m}:${s}`;

    if(h==="01" && m==="14"){

        abrirHumanidade();

    }

}

setInterval(atualizarRelogio,100);

atualizarRelogio();

let cliques=0;
let ultimoClique=0;

document.body.addEventListener("click",function(e){

    if(e.target!==document.body && e.target!==cloud){

        return;

    }

    const agora=Date.now();

    if(agora-ultimoClique>1500){

        cliques=0;

    }

    ultimoClique=agora;

    cliques++;

    if(cliques>=7){

        abrirHumanidade();

        cliques=0;

    }

});

window.addEventListener("resize",()=>{

    cloud.innerHTML="";

    gerarNuvem();
